events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Map WebSocket / SSE upgrade headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. HTTP Server - Redirect everything to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name deskos.local raspberrypi.local localhost "";

        location /health {
            proxy_pass http://deskos:8765/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server - Secure Context for Web Speech API & Microphone Permissions
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name deskos.local raspberrypi.local localhost "";

        ssl_certificate     /etc/nginx/certs/deskos.crt;
        ssl_certificate_key /etc/nginx/certs/deskos.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Disable max body limit for large voice transcripts
        client_max_body_size 16M;

        # Server-Sent Events (SSE) streaming endpoint (CRITICAL: zero buffering)
        location /api/events {
            proxy_pass http://deskos:8765/api/events;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Unbuffered streaming for real-time dashboard dials
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # Main API & Dashboard Proxy
        location / {
            proxy_pass http://deskos:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}

